name: Bug report
description: Something in the layout, a mod or the installer doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Screenshots help; hide any private names first.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: herdr version
      description: Output of `herdr --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Errors
      description: Output of `herdr-app check mods/<mod>`, or any `*.error` file in `~/.config/herdr-app`
      render: text
