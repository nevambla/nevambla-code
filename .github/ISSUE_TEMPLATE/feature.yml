name: Idea or feature
description: Suggest an improvement, an optimization or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like
      description: What you want to do and why the layout doesn't let you do it yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Optional. Which panel or mod it touches, how it would look or behave.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
